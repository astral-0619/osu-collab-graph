name: update-collab-data

on:
  # 自动更新已按 oines 要求关闭（2026-08-09），只保留手动触发
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/crawl-trigger'

concurrency:
  group: update-collab-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests networkx python-louvain

      - name: 全量重爬（实测 Actions 干净 IP ~67 分钟/3732 uid）
        run: python3 scripts/crawl_collab_lists_v2.py --fresh

      - name: 提交爬取结果
        run: |
          git config user.name "astral-0619"
          git config user.email "3794477609@qq.com"
          git add data/collab_lists.jsonl
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "data: 全量重爬 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: 刷维度（name 全量 / team / country）
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python3 scripts/fetch_dimension.py --field=name --refresh --web-fallback
          python3 scripts/fetch_dimension.py --field=team
          python3 scripts/fetch_dimension.py --field=country
          python3 scripts/fetch_dimension.py --field=stats

      - name: 重建图 + 出网页数据
        run: |
          python3 scripts/merge_lists_into_graph.py
          python3 scripts/generate_web_data.py

      - name: 自检（问题会 fail）
        run: python3 scripts/selfcheck.py

      - name: 清理触发文件
        run: |
          rm -f data/crawl-trigger
          git add -A
          git config user.name "astral-0619"
          git config user.email "3794477609@qq.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: 清理 crawl-trigger [skip ci]"
            git push
          fi

      - name: 提交并推送
        run: |
          git config user.name "astral-0619"
          git config user.email "3794477609@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
