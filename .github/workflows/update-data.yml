name: update-collab-data

on:
  schedule:
    # UTC 周五 16:00 = 北京时间周六 00:00，每周全量刷新
    - cron: '0 16 * * 5'
  workflow_dispatch:

concurrency:
  group: update-collab-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests networkx python-louvain

      - name: 分片重爬（--fresh + shard 4 片并行）
        run: python3 scripts/crawl_collab_lists_v2.py --fresh --shard-i=${{ matrix.shard }} --shard-n=4

      - name: 提交本片结果
        run: |
          git config user.name "astral-0619"
          git config user.email "3794477609@qq.com"
          git add data/collab_lists.shard${{ matrix.shard }}.jsonl
          if git diff --cached --quiet; then
            echo "本片无数据变化"
          else
            git commit -m "data: 爬取分片 ${{ matrix.shard }}/4 [skip ci]"
            git push
          fi

  update:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests networkx python-louvain

      - name: 合并分片到 collab_lists.jsonl
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          out = Path("data/collab_lists.jsonl")
          if out.exists():
              out.unlink()
          seen = set()
          with out.open("a", encoding="utf-8") as f:
              for p in sorted(Path("data").glob("collab_lists.shard*.jsonl")):
                  for line in p.read_text(encoding="utf-8").splitlines():
                      try:
                          o = json.loads(line)
                      except Exception:
                          continue
                      if o["uid"] in seen:
                          continue
                      seen.add(o["uid"])
                      f.write(json.dumps(o, ensure_ascii=False) + "\n")
          print(f"合并完成: {len(seen)} uid", flush=True)
          PYEOF

      - name: 刷维度（name 全量 / team / country）
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python3 scripts/fetch_dimension.py --field=name --refresh --web-fallback
          python3 scripts/fetch_dimension.py --field=team
          python3 scripts/fetch_dimension.py --field=country
          python3 scripts/fetch_dimension.py --field=stats

      - name: 重建图 + 出网页数据
        run: |
          python3 scripts/merge_lists_into_graph.py
          python3 scripts/generate_web_data.py

      - name: 自检（问题会 fail）
        run: python3 scripts/selfcheck.py

      - name: 提交并推送
        run: |
          git config user.name "astral-0619"
          git config user.email "3794477609@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
