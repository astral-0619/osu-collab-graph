<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>osu! collab 互链图 (v6 权重版)</title>
<style>
  body { margin:0; font-family: "PingFang SC","Microsoft YaHei",sans-serif; background:#111; color:#eee; }
  #header { padding:10px 16px; background:#1a1a2e; border-bottom:1px solid #333; display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  #header h1 { font-size:16px; margin:0; }
  .stat { font-size:13px; color:#9f9; }
  #wrap { display:flex; height:calc(100vh - 52px); }
  #network { flex:1; }
  #side { width:300px; background:#16161f; padding:12px; overflow-y:auto; font-size:13px; border-left:1px solid #333; }
  #side h3 { font-size:13px; margin:8px 0 6px; color:#ffd700; }
  #search { width:100%; box-sizing:border-box; padding:6px; margin-bottom:8px; border:1px solid #555; background:#222; color:#eee; border-radius:4px; }
  .player-row { padding:4px 6px; cursor:pointer; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-row:hover { background:#2a2a3a; }
  .player-row.selected { background:#3a3a5a; }
  .nbr-row { padding:3px 6px; cursor:pointer; border-radius:4px; }
  .nbr-row:hover { background:#2a2a3a; }
  .btn { display:inline-block; margin:6px 4px 6px 0; padding:5px 10px; background:#2a4a7a; color:#fff; border-radius:4px; cursor:pointer; text-decoration:none; font-size:12px; }
  .btn:hover { background:#3a5a9a; }
  .muted { color:#888; font-size:12px; }
  .big { font-size:18px; font-weight:bold; }
</style>
</head>
<body>
<div id="header">
  <h1>osu! collab 互链图 <span style="font-size:11px;color:#888">(v6 权重版)</span></h1>
  <span class="stat" id="stat"></span>
  <span style="font-size:12px;color:#aaa">点击玩家才显示 TA 的连线（线色 = 双方 collab 图数：灰1 蓝2 橙3-5 红6-9 深红10+），点空白收起</span>
  <a href="https://github.com/astral-0619/osu-collab-graph" target="_blank" style="font-size:12px;color:#6cf;text-decoration:none;margin-left:auto">GitHub ↗</a>
</div>
<div id="wrap">
  <div id="network"></div>
  <div id="side">
    <input id="search" placeholder="搜索玩家名… (回车)">
    <div id="panel"></div>
  </div>
</div>
<script src="vis-network.min.js"></script>
<script src="graph_data.js?v=10"></script>
<script>
const D = window.GRAPH_DATA;
document.getElementById("stat").textContent =
  D.stats.nodes + " 节点 / " + D.stats.edges + " 边（" + D.stats.mutualEdges + " 条双向，最大 ×" + D.stats.maxWeight + "）";

// 邻接表：uid -> {name, degree, nbrs: [{id,name,deg}]}
const byId = {};
D.nodes.forEach(n => byId[n.id] = { name: n.label, degree: n.degree, total_links: n.total_links || 0, mutual_count: n.mutual_count || 0, nbrs: [] });
D.edges.forEach(e => {
  if (byId[e.from] && byId[e.to]) {
    byId[e.from].nbrs.push({ id: e.to, name: byId[e.to].name, deg: byId[e.to].degree, w: e.w || 1 });
    byId[e.to].nbrs.push({ id: e.from, name: byId[e.from].name, deg: byId[e.from].degree, w: e.w || 1 });
  }
});
// 排序：先按 collab 图数量（权重）降序，再按对方 collab 玩家数降序
Object.values(byId).forEach(v => v.nbrs.sort((a,b) => (b.w - a.w) || (b.deg - a.deg)));
D.nodes.forEach(n => { if (byId[n.id]) byId[n.id].alt = n.alt || null; });

// 边权重 → 颜色/宽度/透明度（w = 两人互相展示的 collab 图数量）
function edgeStyle(w) {
  if (w >= 10) return { color: "#c0392b", opacity: 0.75, width: 2.6 };
  if (w >= 6)  return { color: "#e15759", opacity: 0.65, width: 2.1 };
  if (w >= 3)  return { color: "#f28e2b", opacity: 0.5,  width: 1.5 };
  if (w >= 2)  return { color: "#4e79a7", opacity: 0.38, width: 1.0 };
  return { color: "#888888", opacity: 0.15, width: 0.5 };
}
const nodes = new vis.DataSet(D.nodes.map(n => ({
  id: n.id, label: n.label, value: n.value,
  color: { background: n.color, border: n.color, highlight: { background: n.color, border: "#fff" } },
  font: { color: "#ddd", size: n.degree >= 50 ? 14 : 11 },
  shape: "dot", borderWidth: 1,
})));
const edges = new vis.DataSet(D.edges.map((e, i) => {
  const s = edgeStyle(e.w || 1);
  return {
    id: i, from: e.from, to: e.to, width: s.width, hidden: true,
    color: { color: s.color, opacity: s.opacity, highlight: s.color },
    title: `${byId[e.from].name} ↔ ${byId[e.to].name}：${e.w} 张 collab`,
  };
}));
// uid -> 相连的边 id 列表
const edgeIndex = {};
D.edges.forEach((e, i) => {
  (edgeIndex[e.from] = edgeIndex[e.from] || []).push(i);
  (edgeIndex[e.to] = edgeIndex[e.to] || []).push(i);
});
function showEdgesFor(uid) {
  const updates = [];
  D.edges.forEach((e, i) => {
    if (e.from === uid || e.to === uid) updates.push({ id: i, hidden: false });
  });
  edges.update(updates);
}
function hideAllEdges() {
  const updates = [];
  for (let i = 0; i < D.edges.length; i++) updates.push({ id: i, hidden: true });
  edges.update(updates);
}
const container = document.getElementById("network");
const options = {
  physics: { barnesHut: { gravitationalConstant: -12000, springLength: 130, springConstant: 0.03, theta: 0.8 }, stabilization: { iterations: 120 } },
  interaction: { hover: true, tooltipDelay: 80, hideEdgesOnDrag: true, hideEdgesOnZoom: true, hideLabelsOnDrag: true, hideLabelsOnZoom: true },
  nodes: { scaling: { min: 6, max: 60 } },
};
const network = new vis.Network(container, { nodes, edges }, options);
// 布局稳定后关闭物理模拟：拖拽/缩放不再实时算力，浏览更流畅
network.once("stabilizationIterationsDone", () => {
  network.setOptions({ physics: { enabled: false } });
});

let navStack = [];
let currentUid = null;

function selectPlayer(uid, opts) {
  opts = opts || {};
  const info = byId[uid];
  if (!info) return;
  if (opts.push && currentUid && currentUid !== uid) navStack.push(currentUid);
  currentUid = uid;
  network.selectNodes([uid]);
  network.focus(uid, { scale: 1.0 });
  showEdgesFor(uid);
  renderPanel(uid);
}

function goBack() {
  if (navStack.length) {
    const prev = navStack.pop();
    currentUid = prev;
    network.selectNodes([prev]);
    network.focus(prev, { scale: 1.0 });
    showEdgesFor(prev);
    renderPanel(prev);
  } else {
    currentUid = null;
    network.unselectAll();
    hideAllEdges();
    renderPanel(null);
  }
}

function renderPanel(uid) {
  const p = document.getElementById("panel");
  const info = byId[uid];
  if (!info) {
    // 默认态：全图枢纽 Top50
    let h = `<h3>全图枢纽 Top50（点击查看）</h3>`;
    D.topHubs.forEach((hub, i) => {
      const nodeId = D.nodes.find(n => n.label === hub.name).id;
      h += `<div class="player-row" onclick="selectPlayer(${nodeId}, {})">${i+1}. ${hub.name} <span class="muted">(${hub.deg} 人 · ${hub.links} 张)</span></div>`;
    });
    h += `<div class="muted" style="margin-top:10px">点击图中节点查看该玩家的 collab 名单</div>`;
    p.innerHTML = h;
    return;
  }
  let h = `<div class="btn" style="background:#444" onclick="goBack()">← 返回上一级</div>`;
  h += `<div class="big">${info.name}</div>`;
  h += (info.alt ? `<div class="muted">collab 图标注: ${info.alt}</div>` : "");
  h += `<div class="muted">collab 玩家: ${info.nbrs.length}｜累计 ${info.total_links} 张｜双向互链 ${info.mutual_count} 人</div>`;
  h += `<a class="btn" href="https://osu.ppy.sh/users/${uid}" target="_blank">打开 osu 主页 ↗</a>`;
  h += `<h3>TA 的 collab 玩家（${info.nbrs.length}）</h3>`;
  info.nbrs.forEach(nb => {
    const badge = nb.w >= 2 ? ` <span class="muted" style="color:#e15759">×${nb.w}</span>` : "";
    h += `<div class="nbr-row" onclick="selectPlayer(${nb.id}, {push:true})">${nb.name}${badge} <span class="muted">(${nb.deg})</span></div>`;
  });
  p.innerHTML = h;
  p.scrollTop = 0;
}

network.on("click", function(params) {
  if (params.nodes.length) selectPlayer(params.nodes[0], {push:true});
  else { currentUid = null; network.unselectAll(); hideAllEdges(); renderPanel(null); }
});

const inp = document.getElementById("search");
inp.addEventListener("keydown", function(e) {
  if (e.key !== "Enter") return;
  const q = inp.value.trim().toLowerCase();
  if (!q) return;
  const hit = D.nodes.find(n => n.label && n.label.toLowerCase().includes(q));
  if (hit) selectPlayer(hit.id, {});
  else inp.style.borderColor = "#c33";
});
renderPanel(null);
</script>
</body>
</html>
